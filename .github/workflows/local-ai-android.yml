name: LOCAL AI · Android APK

# Builds the LOCAL AI test APK and publishes it as a downloadable pre-release
# ("local-ai-latest") so it can be installed directly on a phone.
on:
  push:
    paths:
      - "local-ai/android/**"
      - ".github/workflows/local-ai-android.yml"
      - ".gitmodules"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: local-ai-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LOCALAI_VERSION_CODE: ${{ github.run_number }}
      NDK_VERSION: "28.2.13676358"
    steps:
      - name: Check out (with pinned llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK, CMake and platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;3.31.6" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: local-ai/android/app/.cxx
          key: cxx-${{ runner.os }}-${{ hashFiles('local-ai/android/app/src/main/cpp/**/*.cpp', 'local-ai/android/app/src/main/cpp/CMakeLists.txt', '.gitmodules') }}-${{ github.sha }}
          restore-keys: cxx-${{ runner.os }}-

      - name: Unit tests and release APK
        working-directory: local-ai/android
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Verify 16 KB page alignment and collect APK
        id: apk
        run: |
          APK=local-ai/android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK" | tail -n 3
          VERSION="0.1.${LOCALAI_VERSION_CODE}"
          OUT="LocalAI-${VERSION}.apk"
          cp "$APK" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      - name: Publish "local-ai-latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete local-ai-latest --yes --cleanup-tag || true
          cat > notes.md <<NOTES
          **LOCAL AI ${{ steps.apk.outputs.version }}** · test build from \`${GITHUB_REF_NAME}\` @ ${GITHUB_SHA::7}

          Install on an Android phone (arm64, Android 8.0+):
          1. Open this page on the phone and download \`${{ steps.apk.outputs.file }}\`.
          2. Open the file and allow "Install unknown apps" for your browser when asked.
          3. Launch **LOCAL AI** and download a starter model (Wi-Fi recommended).

          4 GB and 6 GB phones run in **Lite mode** automatically.
          This build is signed with a public test key. It is not a Play Store release.
          NOTES
          gh release create local-ai-latest "${{ steps.apk.outputs.file }}" \
            --target "${GITHUB_SHA}" --prerelease \
            --title "LOCAL AI ${{ steps.apk.outputs.version }} (test build)" \
            --notes-file notes.md
          echo "### LOCAL AI ${{ steps.apk.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/local-ai-latest" >> "$GITHUB_STEP_SUMMARY"
